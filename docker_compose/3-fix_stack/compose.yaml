services:
  db:
    image: postgres:16
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    environment:
      POSTGRES_PASSWORD: holberton

  cache:
    image: redis:7-alpine

  web:
    image: nginx:alpine
    ports:
      - "5050:80"

  api:
    image: nginx:alpine
    ports:
      - "8080:8080"
    depends_on:
      - db
