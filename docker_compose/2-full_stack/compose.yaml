name: holberton

services:
  db:
    image: postgres:16
    container_name: holberton_db
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "holberton"]
      interval: 3s
      timeout: 3s
      retries: 3
    environment:
      POSTGRES_USER: holberton
      POSTGRES_PASSWORD: holberton
      POSTGRES_DB: holberton
    networks:
      - holberton_net

  cache:
    image: redis:7
    container_name: holberton_cache
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 3
    networks:
      - holberton_net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: holberton_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - holberton_net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: holberton_frontend
    restart: always
    depends_on:
      - backend
    networks:
      - holberton_net

  reverse_proxy:
    image: nginx:latest
    container_name: holberton_reverse_proxy
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: always
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    networks:
      - holberton_net

volumes:
  db_data:

networks:
  holberton_net:
    name: holberton_net
